<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background:#0a0a0f;
            color:#e2e8f0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            background-image:radial-gradient(ellipse at top,rgba(0,255,136,.08) 0%,transparent 60%),
                radial-gradient(ellipse at bottom right,rgba(0,255,136,.04) 0%,transparent 60%);
        }
        .container{
            background:#12121e;
            border:1px solid rgba(0,255,136,.2);
            border-radius:24px;
            padding:40px 30px;
            max-width:420px;
            width:100%;
            text-align:center;
            box-shadow:0 24px 64px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05) inset;
        }
        .logo{
            font-size:64px;
            margin-bottom:12px;
        }
        h1{
            font-size:28px;
            font-weight:900;
            background:linear-gradient(135deg,#00ff88,#00cc6a);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            margin-bottom:6px;
        }
        .sub{
            font-size:13px;
            color:#8a7d90;
            margin-bottom:24px;
            letter-spacing:1px;
        }
        .btn-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
            margin-bottom:16px;
        }
        .btn{
            padding:14px 10px;
            border:none;
            border-radius:12px;
            font-size:14px;
            font-weight:700;
            cursor:pointer;
            font-family:inherit;
            transition:all .2s;
            text-decoration:none;
            display:block;
            text-align:center;
        }
        .btn-admin{
            background:linear-gradient(135deg,#00ff88,#00cc6a);
            color:#0a0a0f;
            box-shadow:0 4px 16px rgba(0,255,136,.3);
        }
        .btn-admin:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(0,255,136,.4);
        }
        .btn-panel{
            background:rgba(0,255,136,.08);
            color:#00ff88;
            border:1.5px solid rgba(0,255,136,.3);
        }
        .btn-panel:hover{
            background:rgba(0,255,136,.15);
            transform:translateY(-2px);
        }
        .footer{
            font-size:11px;
            color:#8a7d90;
            margin-top:16px;
            border-top:1px solid rgba(255,255,255,.06);
            padding-top:16px;
        }
        .footer span{
            color:#00ff88;
        }
        .badge{
            display:inline-block;
            background:rgba(0,255,136,.1);
            border:1px solid rgba(0,255,136,.2);
            border-radius:20px;
            padding:4px 14px;
            font-size:11px;
            color:#00ff88;
            margin-bottom:16px;
        }
        .status-dot{
            display:inline-block;
            width:8px;
            height:8px;
            border-radius:50%;
            background:#00ff88;
            box-shadow:0 0 8px rgba(0,255,136,.5);
            animation:blink 2s infinite;
            margin-right:6px;
        }
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
        .pass-hint{
            font-size:11px;
            color:#8a7d90;
            background:rgba(255,255,255,.04);
            border-radius:8px;
            padding:8px 12px;
            margin-top:12px;
            border:1px solid rgba(255,255,255,.06);
        }
        .pass-hint strong{
            color:#00ff88;
            font-family:monospace;
            letter-spacing:1px;
        }
        @media (max-width:480px){
            .container{padding:28px 18px;}
            .btn-grid{grid-template-columns:1fr;}
            h1{font-size:24px;}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🃏</div>
        <h1>Joker Admin</h1>
        <div class="sub">Secure Control Panel</div>

        <div class="badge">
            <span class="status-dot"></span>
            System Online
        </div>

        <div class="btn-grid">
            <a href="joker-admin.html" class="btn btn-admin">🔐 Admin Panel</a>
            <a href="joker-panel.html" class="btn btn-panel">📱 Client Panel</a>
        </div>

        <div class="pass-hint">
            🔑 Default Password: <strong>admin123</strong>
        </div>

        <div class="footer">
            <span>⚡</span> Joker Monitor System v2.0
        </div>
    </div>
</body>
</html>
